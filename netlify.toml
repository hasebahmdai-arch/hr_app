[build]
  command = "npm run build"
  publish = ".next"

# Public company config (appears in UI / defaults) — not secrets
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "COMPANY_CODE_PREFIX,COMPANY_TIMEZONE,BRAND_PRIMARY_HEX"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

[functions."scheduled-birthdays"]
  schedule = "0 8 * * *"

# Midnight Asia/Karachi (UTC+5) ≈ 19:00 UTC
[functions."scheduled-auto-checkout"]
  schedule = "0 19 * * *"
